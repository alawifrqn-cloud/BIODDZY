<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odds Calculator & Value Betting Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl">
      <h1 class="text-2xl font-black text-emerald-400 tracking-wide uppercase">ODDS CALCULATOR</h1>
      <p class="text-xs text-slate-400 mt-1">Isi semua market sekaligus ➔ HITUNG SEMUA ➔ ranking Top Pick.</p>
    </div>

    <!-- MAIN FORM CONTAINER -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
      
      <!-- TIM & H2H DATA -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">HOME</label>
          <input type="text" id="homeName" value="REAL BETIS" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm font-bold text-slate-100 focus:border-emerald-500 focus:outline-none uppercase">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">AWAY</label>
          <input type="text" id="awayName" value="REAL SOCIEDAD" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm font-bold text-slate-100 focus:border-emerald-500 focus:outline-none uppercase">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">SAMPEL H2H (MATCH)</label>
          <input type="number" id="h2hCount" value="10" min="5" max="100" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm font-bold text-amber-400 focus:border-emerald-500 focus:outline-none">
        </div>
      </div>

      <h2 class="text-lg font-black text-slate-200 border-b border-slate-800 pb-2 uppercase tracking-wide">MARKETS</h2>

      <!-- MARKET 1X2 -->
      <div class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">1x2 / Winning Odds</span>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">HOME ODDS (M1)</label>
            <input type="number" step="0.001" id="oddsM1" value="2.45" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-sky-400 focus:border-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">DRAW ODDS (X)</label>
            <input type="number" step="0.001" id="oddsX" value="3.25" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-amber-400 focus:border-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">AWAY ODDS (M2)</label>
            <input type="number" step="0.001" id="oddsM2" value="2.90" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400 focus:border-emerald-500 focus:outline-none">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-[10px] text-slate-500 mb-1">HIT H2H HOME WIN</label>
            <input type="number" id="hitM1" value="4" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-1">HIT H2H DRAW</label>
            <input type="number" id="hitX" value="3" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-1">HIT H2H AWAY WIN</label>
            <input type="number" id="hitM2" value="3" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
        </div>
      </div>

      <!-- MARKET HDP / ASIAN HANDICAP -->
      <div class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">HDP / Asian Handicap</span>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">HOME LINE</label>
            <input type="text" id="hdpHomeLine" value="-0.25" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-slate-200 mb-2">
            <label class="block text-[11px] text-slate-400 mb-1">HOME ODDS</label>
            <input type="number" step="0.001" id="oddsHdpHome" value="1.843" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">AWAY LINE</label>
            <input type="text" id="hdpAwayLine" value="+0.25" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-slate-200 mb-2">
            <label class="block text-[11px] text-slate-400 mb-1">AWAY ODDS</label>
            <input type="number" step="0.001" id="oddsHdpAway" value="2.115" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4 pt-1">
          <div>
            <label class="block text-[10px] text-slate-500 mb-1">HIT H2H COVER HOME LINE</label>
            <input type="number" id="hitHdpHome" value="6" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-1">HIT H2H COVER AWAY LINE</label>
            <input type="number" id="hitHdpAway" value="4" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
        </div>
      </div>

      <!-- MARKET OVER / UNDER -->
      <div class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">OVER / UNDER</span>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">OVER LINE</label>
            <input type="text" id="ouOverLine" value="2.5" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-slate-200 mb-2">
            <label class="block text-[11px] text-slate-400 mb-1">OVER ODDS</label>
            <input type="number" step="0.001" id="oddsOuOver" value="1.91" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">UNDER LINE</label>
            <input type="text" id="ouUnderLine" value="2.5" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-slate-200 mb-2">
            <label class="block text-[11px] text-slate-400 mb-1">UNDER ODDS</label>
            <input type="number" step="0.001" id="oddsOuUnder" value="2.034" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4 pt-1">
          <div>
            <label class="block text-[10px] text-slate-500 mb-1">HIT H2H OVER LINE</label>
            <input type="number" id="hitOuOver" value="6" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-1">HIT H2H UNDER LINE</label>
            <input type="number" id="hitOuUnder" value="4" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
        </div>
      </div>

      <!-- MARKET BTTS -->
      <div class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">BOTH TEAMS TO SCORE (BTTS)</span>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">BTTS YA ODDS</label>
            <input type="number" step="0.001" id="oddsBttsYes" value="1.75" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
            <label class="block text-[10px] text-slate-500 mt-2 mb-1">HIT H2H BTTS YA</label>
            <input type="number" id="hitBttsYes" value="7" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">BTTS TIDAK ODDS</label>
            <input type="number" step="0.001" id="oddsBttsNo" value="2.05" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-rose-400">
            <label class="block text-[10px] text-slate-500 mt-2 mb-1">HIT H2H BTTS TIDAK</label>
            <input type="number" id="hitBttsNo" value="3" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-300">
          </div>
        </div>
      </div>

      <button onclick="hitungSemua()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 rounded-xl shadow-lg transition duration-200 uppercase tracking-wider text-base">
        🚀 HITUNG SEMUA & RANKING TOP PICK
      </button>

    </div>

    <!-- BOX HASIL ANALISIS -->
    <div id="resultBox" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl hidden space-y-6">
      <h2 class="text-lg font-bold text-slate-200 border-b border-slate-800 pb-2 uppercase tracking-wide">🏆 RANKING TOP PICK & VALUE BET</h2>
      
      <div id="topPickCard" class="bg-emerald-500/10 border border-emerald-500/40 p-5 rounded-xl"></div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="text-xs text-slate-400 uppercase border-b border-slate-800">
            <tr>
              <th class="pb-3">Market Line</th>
              <th class="pb-3">Odds</th>
              <th class="pb-3">Implied Prob</th>
              <th class="pb-3">H2H Hit Rate</th>
              <th class="pb-3">Margin / Edge</th>
              <th class="pb-3">Expected ROI</th>
              <th class="pb-3 text-right">Status</th>
            </tr>
          </thead>
          <tbody id="resultTableBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // MASUKKAN API KEY DI BAWAH INI (JIKA PUNYA):
    const MY_API_KEY = "PASTE_API_KEY_KAMU_DISINI";

    function hitungSemua() {
      const home = document.getElementById('homeName').value || "HOME";
      const away = document.getElementById('awayName').value || "AWAY";
      const totalH2H = parseFloat(document.getElementById('h2hCount').value) || 10;

      const markets = [
        { name: `HDP ${home} (${document.getElementById('hdpHomeLine').value})`, odds: parseFloat(document.getElementById('oddsHdpHome').value), hits: parseFloat(document.getElementById('hitHdpHome').value) },
        { name: `HDP ${away} (${document.getElementById('hdpAwayLine').value})`, odds: parseFloat(document.getElementById('oddsHdpAway').value), hits: parseFloat(document.getElementById('hitHdpAway').value) },
        { name: `OVER ${document.getElementById('ouOverLine').value}`, odds: parseFloat(document.getElementById('oddsOuOver').value), hits: parseFloat(document.getElementById('hitOuOver').value) },
        { name: `UNDER ${document.getElementById('ouUnderLine').value}`, odds: parseFloat(document.getElementById('oddsOuUnder').value), hits: parseFloat(document.getElementById('hitOuUnder').value) },
        { name: `1X2: ${home} (M1)`, odds: parseFloat(document.getElementById('oddsM1').value), hits: parseFloat(document.getElementById('hitM1').value) },
        { name: `1X2: Seri (X)`, odds: parseFloat(document.getElementById('oddsX').value), hits: parseFloat(document.getElementById('hitX').value) },
        { name: `1X2: ${away} (M2)`, odds: parseFloat(document.getElementById('oddsM2').value), hits: parseFloat(document.getElementById('hitM2').value) },
        { name: `BTTS (Ya)`, odds: parseFloat(document.getElementById('oddsBttsYes').value), hits: parseFloat(document.getElementById('hitBttsYes').value) },
        { name: `BTTS (Tidak)`, odds: parseFloat(document.getElementById('oddsBttsNo').value), hits: parseFloat(document.getElementById('hitBttsNo').value) }
      ];

      let bestPick = null;
      let highestROI = -999;
      const tableBody = document.getElementById('resultTableBody');
      tableBody.innerHTML = '';

      markets.forEach(m => {
        if (!m.odds || m.odds <= 1) return;

        const implied = (1 / m.odds) * 100;
        const hitRate = (m.hits / totalH2H) * 100;
        const edge = hitRate - implied;
        const ev = (hitRate / 100 * (m.odds - 1)) - ((100 - hitRate) / 100);
        const roi = ev * 100;

        if (roi > highestROI) {
          highestROI = roi;
          bestPick = { name: m.name, odds: m.odds, hitRate, implied, roi, edge };
        }

        let badge = "";
        if (roi > 10) {
          badge = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-[10px] px-2 py-0.5 rounded font-bold">TOP VALUE</span>`;
        } else if (roi > 0) {
          badge = `<span class="bg-sky-500/20 text-sky-400 border border-sky-500/40 text-[10px] px-2 py-0.5 rounded font-bold">VALUE</span>`;
        } else {
          badge = `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/40 text-[10px] px-2 py-0.5 rounded font-bold">NO VALUE</span>`;
        }

        const row = `
          <tr>
            <td class="py-3 font-semibold text-slate-200">${m.name}</td>
            <td class="py-3 font-bold">${m.odds}</td>
            <td class="py-3 text-sky-400 font-semibold">${implied.toFixed(2)}%</td>
            <td class="py-3 text-amber-400 font-semibold">${hitRate.toFixed(2)}% (${m.hits}/${totalH2H})</td>
            <td class="py-3 font-bold ${edge >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${edge >= 0 ? '+' : ''}${edge.toFixed(2)}%</td>
            <td class="py-3 font-bold ${roi >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${roi >= 0 ? '+' : ''}${roi.toFixed(2)}%</td>
            <td class="py-3 text-right">${badge}</td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });

      if (bestPick) {
        document.getElementById('topPickCard').innerHTML = `
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div>
              <span class="text-xs font-extrabold text-emerald-400 uppercase tracking-widest block mb-1">🔥 TOP REKOMENDASI VALUE BET</span>
              <h3 class="text-xl font-extrabold text-white">${bestPick.name} @ Odds ${bestPick.odds}</h3>
              <p class="text-xs text-slate-300 mt-1">Hit Rate Historis H2H: <span class="font-bold text-amber-400">${bestPick.hitRate.toFixed(2)}%</span> | Edge: <span class="font-bold text-emerald-400">+${bestPick.edge.toFixed(2)}%</span></p>
            </div>
            <div class="bg-emerald-500 text-slate-950 font-black text-sm px-4 py-2.5 rounded-xl border border-emerald-400 shadow-md">
              PROJECTED ROI: +${bestPick.roi.toFixed(2)}%
            </div>
          </div>
        `;
      }

      document.getElementById('resultBox').classList.remove('hidden');
    }

    window.onload = hitungSemua;
  </script>
</body>
</html>
