<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odds Calculator & Value Betting Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl">
      <h1 class="text-2xl font-black text-emerald-400 tracking-wide uppercase">ODDS CALCULATOR</h1>
      <p class="text-xs text-slate-400 mt-1">Isi Home Line & Over Line ➔ Away Line & Under Line terisi otomatis ➔ HITUNG PROBABILITAS.</p>
    </div>

    <!-- MAIN FORM CONTAINER -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
      
      <!-- TIM DATA -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">HOME</label>
          <input type="text" id="homeName" value="REAL BETIS" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm font-bold text-slate-100 focus:border-emerald-500 focus:outline-none uppercase">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">AWAY</label>
          <input type="text" id="awayName" value="REAL SOCIEDAD" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm font-bold text-slate-100 focus:border-emerald-500 focus:outline-none uppercase">
        </div>
      </div>

      <h2 class="text-lg font-black text-slate-200 border-b border-slate-800 pb-2 uppercase tracking-wide">MARKETS</h2>

      <!-- MARKET 1X2 -->
      <div class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">1x2 / Winning Odds</span>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">HOME ODDS (M1)</label>
            <input type="number" step="0.001" id="oddsM1" value="2.45" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-sky-400 focus:border-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">DRAW ODDS (X)</label>
            <input type="number" step="0.001" id="oddsX" value="3.25" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-amber-400 focus:border-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">AWAY ODDS (M2)</label>
            <input type="number" step="0.001" id="oddsM2" value="2.90" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400 focus:border-emerald-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- MARKET HDP / ASIAN HANDICAP -->
      <div class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">HDP / Asian Handicap</span>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">HOME LINE (Ketik di sini)</label>
            <input type="text" id="hdpHomeLine" value="-0.25" oninput="autoSyncHdp()" class="w-full bg-slate-900 border border-emerald-500/50 rounded-lg p-2.5 text-sm font-bold text-emerald-300 mb-2 focus:border-emerald-400 focus:outline-none">
            <label class="block text-[11px] text-slate-400 mb-1">HOME ODDS</label>
            <input type="number" step="0.001" id="oddsHdpHome" value="1.843" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">AWAY LINE (Otomatis)</label>
            <input type="text" id="hdpAwayLine" value="+0.25" readonly class="w-full bg-slate-950 border border-slate-800 text-slate-400 rounded-lg p-2.5 text-sm font-bold mb-2 cursor-not-allowed">
            <label class="block text-[11px] text-slate-400 mb-1">AWAY ODDS</label>
            <input type="number" step="0.001" id="oddsHdpAway" value="2.115" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
        </div>
      </div>

      <!-- MARKET OVER / UNDER -->
      <div class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">OVER / UNDER</span>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">OVER LINE (Ketik di sini)</label>
            <input type="text" id="ouOverLine" value="2.5" oninput="autoSyncOU()" class="w-full bg-slate-900 border border-emerald-500/50 rounded-lg p-2.5 text-sm font-bold text-emerald-300 mb-2 focus:border-emerald-400 focus:outline-none">
            <label class="block text-[11px] text-slate-400 mb-1">OVER ODDS</label>
            <input type="number" step="0.001" id="oddsOuOver" value="1.91" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">UNDER LINE (Otomatis)</label>
            <input type="text" id="ouUnderLine" value="2.5" readonly class="w-full bg-slate-950 border border-slate-800 text-slate-400 rounded-lg p-2.5 text-sm font-bold mb-2 cursor-not-allowed">
            <label class="block text-[11px] text-slate-400 mb-1">UNDER ODDS</label>
            <input type="number" step="0.001" id="oddsOuUnder" value="2.034" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
        </div>
      </div>

      <!-- MARKET BTTS -->
      <div class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 space-y-3">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">BOTH TEAMS TO SCORE (BTTS)</span>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">BTTS YA ODDS</label>
            <input type="number" step="0.001" id="oddsBttsYes" value="1.75" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">BTTS TIDAK ODDS</label>
            <input type="number" step="0.001" id="oddsBttsNo" value="2.05" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-rose-400">
          </div>
        </div>
      </div>

      <button onclick="hitungSemua()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 rounded-xl shadow-lg transition duration-200 uppercase tracking-wider text-base">
        🚀 HITUNG ODDS & PROBABILITAS
      </button>

    </div>

    <!-- BOX HASIL ANALISIS -->
    <div id="resultBox" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl hidden space-y-6">
      <h2 class="text-lg font-bold text-slate-200 border-b border-slate-800 pb-2 uppercase tracking-wide">📊 HASIL ANALISIS PROBABILITAS MARKET</h2>
      
      <div id="summaryCard" class="bg-slate-950 border border-slate-800 p-5 rounded-xl space-y-2"></div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="text-xs text-slate-400 uppercase border-b border-slate-800">
            <tr>
              <th class="pb-3">Market Line</th>
              <th class="pb-3">Odds</th>
              <th class="pb-3">Implied Prob</th>
              <th class="pb-3">Fair Prob (No Vig)</th>
              <th class="pb-3 text-right">Fair Odds</th>
            </tr>
          </thead>
          <tbody id="resultTableBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // ============================================================
    // 🔑 BARIS 168: MASUKKAN KODE API KEY KAMU DI SINI:
    // ============================================================
    const MY_API_KEY = "PASTE_API_KEY_KAMU_DISINI";
    // ============================================================

    function autoSyncHdp() {
      const homeVal = document.getElementById('hdpHomeLine').value.trim();
      const awayInput = document.getElementById('hdpAwayLine');
      if (!homeVal) { awayInput.value = ""; return; }
      const num = parseFloat(homeVal);
      if (!isNaN(num)) {
        awayInput.value = num === 0 ? "0" : ((num * -1 > 0 ? "+" : "") + (num * -1));
      } else {
        awayInput.value = homeVal;
      }
    }

    function autoSyncOU() {
      document.getElementById('ouUnderLine').value = document.getElementById('ouOverLine').value.trim();
    }

    function hitungSemua() {
      const home = document.getElementById('homeName').value || "HOME";
      const away = document.getElementById('awayName').value || "AWAY";

      const oM1 = parseFloat(document.getElementById('oddsM1').value) || 0;
      const oX = parseFloat(document.getElementById('oddsX').value) || 0;
      const oM2 = parseFloat(document.getElementById('oddsM2').value) || 0;

      const oHdpHome = parseFloat(document.getElementById('oddsHdpHome').value) || 0;
      const oHdpAway = parseFloat(document.getElementById('oddsHdpAway').value) || 0;

      const oOuOver = parseFloat(document.getElementById('oddsOuOver').value) || 0;
      const oOuUnder = parseFloat(document.getElementById('oddsOuUnder').value) || 0;

      const oBttsYes = parseFloat(document.getElementById('oddsBttsYes').value) || 0;
      const oBttsNo = parseFloat(document.getElementById('oddsBttsNo').value) || 0;

      const impM1 = oM1 > 0 ? (1 / oM1) : 0;
      const impX = oX > 0 ? (1 / oX) : 0;
      const impM2 = oM2 > 0 ? (1 / oM2) : 0;
      const sum1X2 = impM1 + impX + impM2;
      const margin1X2 = sum1X2 > 0 ? (sum1X2 - 1) * 100 : 0;

      const impHdpHome = oHdpHome > 0 ? (1 / oHdpHome) : 0;
      const impHdpAway = oHdpAway > 0 ? (1 / oHdpAway) : 0;
      const sumHdp = impHdpHome + impHdpAway;
      const marginHdp = sumHdp > 0 ? (sumHdp - 1) * 100 : 0;

      const impOuOver = oOuOver > 0 ? (1 / oOuOver) : 0;
      const impOuUnder = oOuUnder > 0 ? (1 / oOuUnder) : 0;
      const sumOu = impOuOver + impOuUnder;
      const marginOu = sumOu > 0 ? (sumOu - 1) * 100 : 0;

      const impBttsYes = oBttsYes > 0 ? (1 / oBttsYes) : 0;
      const impBttsNo = oBttsNo > 0 ? (1 / oBttsNo) : 0;
      const sumBtts = impBttsYes + impBttsNo;
      const marginBtts = sumBtts > 0 ? (sumBtts - 1) * 100 : 0;

      const list = [
        { name: `1X2: ${home} (M1)`, odds: oM1, imp: impM1, sum: sum1X2 },
        { name: `1X2: Seri (X)`, odds: oX, imp: impX, sum: sum1X2 },
        { name: `1X2: ${away} (M2)`, odds: oM2, imp: impM2, sum: sum1X2 },
        { name: `HDP ${home} (${document.getElementById('hdpHomeLine').value})`, odds: oHdpHome, imp: impHdpHome, sum: sumHdp },
        { name: `HDP ${away} (${document.getElementById('hdpAwayLine').value})`, odds: oHdpAway, imp: impHdpAway, sum: sumHdp },
        { name: `OVER ${document.getElementById('ouOverLine').value}`, odds: oOuOver, imp: impOuOver, sum: sumOu },
        { name: `UNDER ${document.getElementById('ouUnderLine').value}`, odds: oOuUnder, imp: impOuUnder, sum: sumOu },
        { name: `BTTS (Ya)`, odds: oBttsYes, imp: impBttsYes, sum: sumBtts },
        { name: `BTTS (Tidak)`, odds: oBttsNo, imp: impBttsNo, sum: sumBtts }
      ];

      const tableBody = document.getElementById('resultTableBody');
      tableBody.innerHTML = '';

      list.forEach(item => {
        if (!item.odds || item.odds <= 1) return;
        const impliedPct = item.imp * 100;
        const fairPct = (item.imp / item.sum) * 100;
        const fairOdds = 1 / (fairPct / 100);

        const row = `
          <tr>
            <td class="py-3 font-semibold text-slate-200">${item.name}</td>
            <td class="py-3 font-bold text-white">${item.odds}</td>
            <td class="py-3 text-sky-400 font-bold">${impliedPct.toFixed(2)}%</td>
            <td class="py-3 text-emerald-400 font-bold">${fairPct.toFixed(2)}%</td>
            <td class="py-3 text-right text-amber-400 font-bold">${fairOdds.toFixed(3)}</td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });

      document.getElementById('summaryCard').innerHTML = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
          <div><span class="text-slate-400">Bookmaker Margin 1X2:</span> <strong class="text-amber-400 block text-sm">${margin1X2.toFixed(2)}%</strong></div>
          <div><span class="text-slate-400">Bookmaker Margin HDP:</span> <strong class="text-amber-400 block text-sm">${marginHdp.toFixed(2)}%</strong></div>
          <div><span class="text-slate-400">Bookmaker Margin O/U:</span> <strong class="text-amber-400 block text-sm">${marginOu.toFixed(2)}%</strong></div>
          <div><span class="text-slate-400">Bookmaker Margin BTTS:</span> <strong class="text-amber-400 block text-sm">${marginBtts.toFixed(2)}%</strong></div>
        </div>
      `;

      document.getElementById('resultBox').classList.remove('hidden');
    }

    window.onload = hitungSemua;
  </script>
</body>
</html>
